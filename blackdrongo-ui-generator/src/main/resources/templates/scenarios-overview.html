<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Scenarios</title>
    <link href="/css/dashboard-theme.css" rel="stylesheet">
    <style>
        .scenarios-intro {
            min-height: 92px;
        }
        .scenarios-board-card {
            min-height: 620px;
            max-height: 620px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .scenarios-board-controls {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: nowrap;
        }
        .scenarios-search {
            width: 280px;
            height: 36px;
            border: 1px solid var(--line);
            border-radius: 10px;
            background: rgba(17, 24, 57, 0.8);
            color: var(--text);
            padding: 8px 10px;
            margin: 0;
        }
        .scenarios-search:focus {
            outline: none;
            border-color: rgba(89, 214, 255, 0.55);
            box-shadow: 0 0 0 3px rgba(89, 214, 255, 0.14);
        }
        .scenarios-board-controls .btn {
            height: 36px;
            min-height: 36px;
            padding: 0 12px;
            font-size: 12px;
            border-radius: 10px;
        }
        .scenarios-table-wrap {
            flex: 1 1 auto;
            min-height: 0;
            overflow: auto;
            margin-top: 12px;
        }
        @media (max-width: 900px) {
            .scenarios-board-controls {
                width: 100%;
                flex-wrap: wrap;
            }
            .scenarios-search {
                width: 100%;
            }
        }
    </style>
</head>
<body class="dashboard-body">
<div class="app-shell">
    <aside class="app-sidebar" th:replace="~{fragments/sidebar :: sidebar('projects')}"></aside>

    <main class="app-main">
        <section class="content-card scenarios-intro">
            <div class="content-header">
                <div>
                    <h2 class="content-title">Scenarios</h2>
                    <div class="subtle">All scenarios across projects.</div>
                </div>
            </div>
        </section>

        <section class="content-card scenarios-board-card">
            <div class="content-header">
                <div>
                    <h2 class="content-title">Scenario Board</h2>
                    <div class="subtle">Detailed list of all configured scenarios.</div>
                </div>
                <div class="scenarios-board-controls">
                    <input class="scenarios-search" oninput="filterScenarioRows(this.value)"
                           placeholder="Search by project, feature, scenario, tags"
                           type="text">
                    <span class="pill">Total <strong th:text="${#lists.size(scenarioRows)}">0</strong></span>
                </div>
            </div>

            <div class="empty-state" th:if="${#lists.isEmpty(scenarioRows)}">
                No scenarios found.
            </div>
            <div class="table-wrap scenarios-table-wrap" th:if="${!#lists.isEmpty(scenarioRows)}">
                <table id="scenarioOverviewTable">
                    <thead>
                    <tr>
                        <th>Project</th>
                        <th>Feature</th>
                        <th>Scenario</th>
                        <th>Tags</th>
                        <th>Status</th>
                        <th>Updated</th>
                        <th>Action</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:attr="data-search=${#strings.toLowerCase((row.projectName() ?: '') + ' ' + (row.featureName() ?: '') + ' ' + (row.scenarioName() ?: '') + ' ' + (row.tags() ?: '') + ' ' + (row.state() ?: ''))}"
                        th:each="row : ${scenarioRows}">
                        <td th:text="${row.projectName()}">Project</td>
                        <td th:text="${row.featureName()}">Feature</td>
                        <td>
                            <div th:text="${row.scenarioName()}">Scenario</div>
                            <div class="message" th:text="${row.message()}">-</div>
                        </td>
                        <td th:text="${row.tags()}"></td>
                        <td>
                            <span class="status"
                                  th:classappend="${row.state() == 'SUCCESS'} ? ' success' :
                                                  (${row.state() == 'FAILURE'} ? ' failure' :
                                                  (${row.state() == 'RUNNING'} ? ' running' : ''))"
                                  th:text="${row.state() == 'NOT_RUN' ? 'Not Run' : row.state()}">Not Run</span>
                        </td>
                        <td class="message" th:text="${row.updatedAt()}"></td>
                        <td>
                            <a class="btn btn-primary"
                               th:href="@{'/projects/' + ${row.projectId()} + '/features#feature-' + ${row.featureId()}}">
                                Open
                            </a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>
</div>
<script>
    function filterScenarioRows(query) {
        const normalized = (query || '').toLowerCase().trim();
        document.querySelectorAll('#scenarioOverviewTable tbody tr').forEach((row) => {
            const haystack = row.dataset.search || '';
            row.style.display = haystack.includes(normalized) ? '' : 'none';
        });
    }
</script>
</body>
</html>
