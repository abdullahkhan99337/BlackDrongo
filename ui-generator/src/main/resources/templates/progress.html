<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Test Progress</title>
    <link href="/css/dashboard-theme.css" rel="stylesheet">
    <style>
        .spinner {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            border: 3px solid rgba(158, 240, 26, 0.25);
            border-top-color: var(--accent);
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .status.success { color: var(--success); }
        .status.failure { color: var(--danger); }
    </style>
</head>
<body class="dashboard-body">
<div class="app-shell">
    <aside class="app-sidebar">
        <div class="brand">
            <div class="brand-mark">B</div>
            <span>BlackDrongo</span>
        </div>
        <div class="nav-section">
            <p class="nav-title">Workspace</p>
            <a class="nav-link" href="/">Overview</a>
            <a class="nav-link" href="/projects">Projects</a>
        </div>
        <div class="nav-section">
            <p class="nav-title">Execution</p>
            <a class="nav-link active" href="/running-tests">Running Tests</a>
        </div>
    </aside>
    <main class="app-main">
        <header class="top-toolbar">
            <div class="toolbar-meta">
                <div class="crumb">Execution / Live Status</div>
                <h1 class="page-title">Test Run Progress</h1>
            </div>
        </header>

        <section class="content-card">
            <p th:if="${scenarioName != null}">Scenario: <strong th:text="${scenarioName}">Scenario</strong></p>
            <p th:if="${engine != null}">Engine: <strong th:text="${engine}">selenium</strong></p>
            <div class="action-row" style="margin-top:12px;">
                <div class="spinner" id="spinner"></div>
                <div class="status" id="statusText">Starting...</div>
            </div>
            <div class="subtle" id="messageText" style="margin-top:8px;">Preparing test run.</div>
            <details id="detailsPanel" style="display:none; margin-top:14px;">
                <summary>Show Details</summary>
                <pre id="detailsText" style="white-space:pre-wrap;"></pre>
            </details>
            <p id="backLink" style="display:none; margin-top:14px;">
                <a class="btn btn-primary" href="/" id="returnLink">Back</a>
            </p>
        </section>
    </main>
</div>

<script th:inline="javascript">
    const runId = /*[[${runId}]]*/ "";
    const statusText = document.getElementById('statusText');
    const messageText = document.getElementById('messageText');
    const spinner = document.getElementById('spinner');
    const backLink = document.getElementById('backLink');
    const returnLink = document.getElementById('returnLink');
    const detailsPanel = document.getElementById('detailsPanel');
    const detailsText = document.getElementById('detailsText');
    const returnUrl = /*[[${returnUrl}]]*/ "/";

    if (returnLink && returnUrl) {
        returnLink.setAttribute('href', returnUrl);
    }

    function updateStatus(data) {
        if (!data) {
            statusText.textContent = 'Unknown run';
            messageText.textContent = 'No status found for this run.';
            spinner.style.display = 'none';
            backLink.style.display = 'block';
            return;
        }
        const state = data.state || 'RUNNING';
        statusText.classList.remove('success', 'failure');
        if (state === 'RUNNING') {
            statusText.textContent = 'Running...';
            messageText.textContent = data.message || 'Running tests...';
            spinner.style.display = 'block';
            detailsPanel.style.display = 'none';
        } else if (state === 'SUCCESS') {
            statusText.textContent = 'Success';
            statusText.classList.add('success');
            messageText.textContent = data.message || 'Tests passed.';
            spinner.style.display = 'none';
            backLink.style.display = 'block';
            if (data.output) {
                detailsText.textContent = data.output;
                detailsPanel.style.display = 'block';
            }
        } else {
            statusText.textContent = 'Failed';
            statusText.classList.add('failure');
            messageText.textContent = data.message || 'Tests failed.';
            spinner.style.display = 'none';
            backLink.style.display = 'block';
            if (data.output) {
                detailsText.textContent = data.output;
                detailsPanel.style.display = 'block';
            }
        }
    }

    async function poll() {
        if (!runId) {
            updateStatus(null);
            return;
        }
        try {
            const response = await fetch(`/status/${runId}`);
            if (!response.ok) {
                updateStatus(null);
                return;
            }
            const data = await response.json();
            updateStatus(data);
            if (data && data.state && data.state !== 'RUNNING') {
                return;
            }
        } catch (e) {
            updateStatus({ state: 'FAILURE', message: 'Failed to read test status.' });
            return;
        }
        setTimeout(poll, 1500);
    }

    poll();
</script>
</body>
</html>
