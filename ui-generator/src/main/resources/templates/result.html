<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Generation Complete</title>
    <link href="/css/dashboard-theme.css" rel="stylesheet">
</head>
<body class="dashboard-body">
<div class="app-shell">
    <aside class="app-sidebar">
        <div class="brand">
            <div class="brand-mark">B</div>
            <span>BlackDrongo</span>
        </div>
        <div class="nav-section">
            <p class="nav-title">Workspace</p>
            <a class="nav-link active" href="/">Overview</a>
            <a class="nav-link" href="/projects">Projects</a>
        </div>
        <div class="nav-section">
            <p class="nav-title">Execution</p>
            <a class="nav-link" href="/running-tests">Running Tests</a>
        </div>
    </aside>
    <main class="app-main">
        <header class="top-toolbar">
            <div class="toolbar-meta">
                <div class="crumb">Execution / Result</div>
                <h1 class="page-title">Generation Complete</h1>
            </div>
        </header>
        <section class="content-card">
            <p th:text="${message}">Generation complete. Tests were not run.</p>
            <a class="btn btn-primary" href="/">Back to Dashboard</a>
        </section>
    </main>
</div>
</body>
</html>
