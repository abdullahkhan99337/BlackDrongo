<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Features</title>
    <link href="/css/dashboard-theme.css" rel="stylesheet">
    <style>
        .features-intro {
            min-height: 92px;
        }
        .features-board-card {
            min-height: 620px;
            max-height: 620px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .features-board-controls {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: nowrap;
        }
        .features-search {
            width: 280px;
            height: 36px;
            border: 1px solid var(--line);
            border-radius: 10px;
            background: rgba(17, 24, 57, 0.8);
            color: var(--text);
            padding: 8px 10px;
            margin: 0;
        }
        .features-search:focus {
            outline: none;
            border-color: rgba(89, 214, 255, 0.55);
            box-shadow: 0 0 0 3px rgba(89, 214, 255, 0.14);
        }
        .features-board-controls .btn {
            height: 36px;
            min-height: 36px;
            padding: 0 12px;
            font-size: 12px;
            border-radius: 10px;
        }
        .features-table-wrap {
            flex: 1 1 auto;
            min-height: 0;
            overflow: auto;
            margin-top: 12px;
        }
        @media (max-width: 900px) {
            .features-board-controls {
                width: 100%;
                flex-wrap: wrap;
            }
            .features-search {
                width: 100%;
            }
        }
    </style>
</head>
<body class="dashboard-body">
<div class="app-shell">
    <aside class="app-sidebar">
        <div class="brand">
            <div class="brand-mark">B</div>
            <span>BlackDrongo</span>
        </div>
        <div class="nav-section">
            <p class="nav-title">Workspace</p>
            <a class="nav-link" href="/">Overview</a>
            <a class="nav-link active" href="/projects">Projects</a>
        </div>
        <div class="nav-section">
            <p class="nav-title">Execution</p>
            <a class="nav-link" href="/running-tests">Running Tests</a>
        </div>
    </aside>

    <main class="app-main">
        <section class="content-card features-intro">
            <div class="content-header">
                <div>
                    <h2 class="content-title">Features</h2>
                    <div class="subtle">All features across projects.</div>
                </div>
            </div>
        </section>

        <section class="content-card features-board-card">
            <div class="content-header">
                <div>
                    <h2 class="content-title">Feature Board</h2>
                    <div class="subtle">Detailed list of all configured features.</div>
                </div>
                <div class="features-board-controls">
                    <input class="features-search" oninput="filterFeatureRows(this.value)" placeholder="Search by project, feature, URL, Jira"
                           type="text">
                    <a class="btn btn-soft" href="/projects">Back to Projects</a>
                    <span class="pill">Total <strong th:text="${#lists.size(featureRows)}">0</strong></span>
                </div>
            </div>
            <div class="empty-state" th:if="${#lists.isEmpty(featureRows)}">
                No features found.
            </div>
            <div class="table-wrap features-table-wrap" th:if="${!#lists.isEmpty(featureRows)}">
                <table id="featuresTable">
                    <thead>
                    <tr>
                        <th>Project</th>
                        <th>Feature</th>
                        <th>Base URL</th>
                        <th>Jira Stories</th>
                        <th>Scenarios</th>
                        <th>Action</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:attr="data-search=${#strings.toLowerCase((row.projectName() ?: '') + ' ' + (row.featureName() ?: '') + ' ' + (row.baseUrl() ?: '') + ' ' + (row.jiraStories() ?: ''))}"
                        th:each="row : ${featureRows}">
                        <td th:text="${row.projectName()}">Project</td>
                        <td>
                            <div th:text="${row.featureName()}">Feature</div>
                            <div class="subtle" th:text="${row.description()}"></div>
                        </td>
                        <td th:text="${row.baseUrl()}">-</td>
                        <td th:text="${row.jiraStories()}">-</td>
                        <td th:text="${row.scenarioCount()}">0</td>
                        <td>
                            <a class="btn btn-primary"
                               th:href="@{'/projects/' + ${row.projectId()} + '/features#feature-' + ${row.featureId()}}">
                                Open
                            </a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>
</div>
<script>
    function filterFeatureRows(query) {
        const value = (query || '').toLowerCase().trim();
        document.querySelectorAll('#featuresTable tbody tr').forEach((row) => {
            const search = row.dataset.search || '';
            row.style.display = search.includes(value) ? '' : 'none';
        });
    }
</script>
</body>
</html>
