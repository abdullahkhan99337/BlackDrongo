<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Project Scenarios</title>
    <link href="/css/dashboard-theme.css" rel="stylesheet">
    <style>
        .scenarios-intro {
            min-height: 92px;
        }
        .scenarios-board-card {
            min-height: 620px;
            max-height: 620px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .scenarios-board-controls {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: nowrap;
        }
        .scenarios-search {
            width: 280px;
            height: 36px;
            border: 1px solid var(--line);
            border-radius: 10px;
            background: rgba(17, 24, 57, 0.8);
            color: var(--text);
            padding: 8px 10px;
            margin: 0;
        }
        .scenarios-search:focus {
            outline: none;
            border-color: rgba(89, 214, 255, 0.55);
            box-shadow: 0 0 0 3px rgba(89, 214, 255, 0.14);
        }
        .scenarios-table-wrap {
            flex: 1 1 auto;
            min-height: 0;
            overflow: auto;
            margin-top: 12px;
        }
        @media (max-width: 900px) {
            .scenarios-board-controls {
                width: 100%;
                flex-wrap: wrap;
            }
            .scenarios-search {
                width: 100%;
            }
        }
    </style>
</head>
<body class="dashboard-body">
<div class="app-shell">
    <aside class="app-sidebar">
        <div class="brand">
            <div class="brand-mark">B</div>
            <span>BlackDrongo</span>
        </div>
        <div class="nav-section">
            <p class="nav-title">Workspace</p>
            <a class="nav-link" href="/">Overview</a>
            <a class="nav-link" href="/projects">Projects</a>
        </div>
        <div class="nav-section">
            <p class="nav-title">Execution</p>
            <a class="nav-link" th:href="@{'/projects/' + ${project.id()} + '/executions'(state='RUNNING')}">Running
                Tests</a>
        </div>
    </aside>

    <main class="app-main">
        <section class="content-card scenarios-intro">
            <div class="content-header">
                <div>
                    <h2 class="content-title" th:text="${project.project().projectName} + ' Scenarios'">Project
                        Scenarios</h2>
                    <div class="subtle">All scenarios within this project.</div>
                </div>
            </div>
        </section>

        <section class="content-card scenarios-board-card">
            <div class="content-header">
                <div>
                    <h2 class="content-title">Scenario Board</h2>
                    <div class="subtle">Detailed list of scenarios for this project.</div>
                </div>
                <div class="scenarios-board-controls">
                    <input class="scenarios-search" oninput="filterProjectScenarioRows(this.value)" placeholder="Search by feature, scenario, tags, status"
                           type="text">
                    <span class="pill">Total <strong th:text="${#lists.size(scenarioRows)}">0</strong></span>
                </div>
            </div>

            <div class="empty-state" th:if="${#lists.isEmpty(scenarioRows)}">No scenarios available for this project.
            </div>
            <div class="table-wrap scenarios-table-wrap" th:if="${!#lists.isEmpty(scenarioRows)}">
                <table id="projectScenarioTable">
                    <thead>
                    <tr>
                        <th>Feature</th>
                        <th>Scenario</th>
                        <th>Tags</th>
                        <th>Status</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:attr="data-search=${#strings.toLowerCase((row.featureName() ?: '') + ' ' + (row.scenarioName() ?: '') + ' ' + (row.tags() ?: '') + ' ' + (row.state() ?: ''))}"
                        th:each="row : ${scenarioRows}">
                        <td th:text="${row.featureName()}">Feature</td>
                        <td th:text="${row.scenarioName()}">Scenario</td>
                        <td th:text="${#strings.isEmpty(row.tags()) ? '-' : row.tags()}">-</td>
                        <td>
                            <span class="pill"
                                  th:classappend="${row.state() == 'SUCCESS'} ? ' ok' : (${row.state() == 'FAILURE'} ? ' fail' : '')"
                                  th:text="${row.state()}">NOT_RUN</span>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>
</div>
<script>
    function filterProjectScenarioRows(query) {
        const normalized = (query || '').toLowerCase().trim();
        document.querySelectorAll('#projectScenarioTable tbody tr').forEach((row) => {
            const haystack = row.dataset.search || '';
            row.style.display = haystack.includes(normalized) ? '' : 'none';
        });
    }
</script>
</body>
</html>
